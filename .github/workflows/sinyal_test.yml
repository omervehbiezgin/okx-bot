name: Sinyal Gecmis Testi

# Tarama botu sinyallerinin geçmişe dönük testi (sinyal_bt.py). Telegram'a MESAJ GÖNDERMEZ (secret verilmez),
# canlı botun durum dosyasına dokunmaz. Sonuçlar "sinyal-test-sonuclari" dalına yazılır.

on:
  workflow_dispatch:
    inputs:
      top:
        description: "Kırılım için hacme göre ilk kaç coin"
        default: "100"
      max_coin:
        description: "En fazla kaç coin (0 = hepsi; deneme için küçük sayı)"
        default: "0"
      betik:
        description: "Test betiği (sinyal_bt.py = ilk test, sinyal_bt2.py = kullanıcı kurallarıyla ikinci test)"
        default: "sinyal_bt2.py"
      modlar:
        description: "sinyal_bt2.py için modlar (10x 5x 3x spot)"
        default: "10x 5x 3x spot"
      tpler:
        description: "Kâr al seçenekleri (ör. 2R %10)"
        default: "2R %10"

permissions:
  contents: write              # sadece sonuç dalına yazmak için

concurrency:
  group: okx-sinyal-test

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Onceki test verisini geri yukle
        uses: actions/cache/restore@v4
        with:
          path: sinyal_cache.json.gz
          key: sinyal-bt-${{ github.run_id }}
          restore-keys: sinyal-bt-
      - run: pip install requests numpy pandas
      - name: Testi calistir
        run: |
          BETIK="${{ inputs.betik || 'sinyal_bt2.py' }}"
          if [ "$BETIK" = "sinyal_bt2.py" ]; then
            for m in ${{ inputs.modlar || '10x 5x 3x spot' }}; do BT_MOD=$m python sinyal_bt2.py; done
          else
            python "$BETIK"
          fi
        env:
          BT_TOP: ${{ inputs.top || '100' }}
          BT_MAX_COIN: ${{ inputs.max_coin || '0' }}
          BT_TEK: "1"
          BT_KOMBI: "1"
          BT_TPTEST: "1"
          BT_TPLER: ${{ inputs.tpler || '2R %10' }}
      - name: Test verisini kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: sinyal_cache.json.gz
          key: sinyal-bt-${{ github.run_id }}
      - name: Sonuclari sinyal-test-sonuclari dalina yaz
        if: always()
        run: |
          ls sinyal_sonuc* >/dev/null 2>&1 || exit 0
          mkdir -p /tmp/sonuc && cp sinyal_sonuc* sinyal_kombi* /tmp/sonuc/ 2>/dev/null || cp sinyal_sonuc* /tmp/sonuc/
          cd /tmp/sonuc
          git init -q -b sinyal-test-sonuclari
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "Sinyal test sonuçları (çalışma ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:sinyal-test-sonuclari
