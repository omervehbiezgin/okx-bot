name: OKX PA Stratejisi

# Mevcut "OKX Hacim Tarayici" (scan.yml) ile hiçbir şey paylaşmaz:
# ayrı dosya (pa_scan_once.py), ayrı durum dosyası (pa_state.json), ayrı cache anahtarı,
# ayrı concurrency grubu. Sadece aynı Telegram secret'larını (TG_TOKEN, TG_CHAT_ID) kullanır.

on:
  schedule:
    - cron: "37 * * * *"         # Yedek: zincir koparsa saatte bir yeniden başlatır
  workflow_dispatch:
    inputs:
      test:
        description: "Test mesajı gönder"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write                 # Bir sonraki turu kendisi başlatabilmesi için

concurrency:
  group: okx-pa-scan
  cancel-in-progress: false

jobs:
  pa:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Onceki durumu geri yukle
        uses: actions/cache/restore@v4
        with:
          path: pa_state.json
          key: pa-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pa-state-

      - run: pip install requests

      - name: PA taramasini 15 dakikada bir calistir (yaklasik 5 saat 30 dk)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TEST_RUN: ${{ inputs.test }}
        run: |
          BASLA=$(date +%s)
          SURE=19800
          while true; do
            python pa_scan_once.py || echo "PA taraması hatayla bitti, döngü devam ediyor."
            export TEST_RUN=false
            SIMDI=$(date +%s)
            BEKLE=$(( 900 - SIMDI % 900 + 20 ))
            if [ $(( SIMDI + BEKLE - BASLA )) -ge $SURE ]; then
              echo "Süre doluyor, bu tur bitiyor; bir sonraki tur başlatılacak."
              break
            fi
            echo "Sonraki tarama $BEKLE saniye sonra."
            sleep $BEKLE
          done

      - name: Durumu kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: pa_state.json
          key: pa-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Bir sonraki turu baslat
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pa_scan.yml --ref ${{ github.ref_name }} -f test=false
