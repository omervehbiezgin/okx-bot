name: OKX Hacim Tarayici

on:
  schedule:
    - cron: "7 * * * *"          # Yedek: zincir koparsa saatte bir yeniden başlatır
  workflow_dispatch:
    inputs:
      test:
        description: "Test mesajı gönder"
        type: boolean
        default: false

permissions:
  contents: write                # sadece kâğıt işlem durumunu 'kagit-durum' dalına yazmak için
  actions: write                 # Bir sonraki turu kendisi başlatabilmesi için

concurrency:
  group: okx-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Onceki durumu geri yukle
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: state-

      - run: pip install requests

      - name: Taramayi 15 dakikada bir calistir (yaklasik 5 saat 30 dk)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_TOKEN_KIRILIM: ${{ secrets.TG_TOKEN_KIRILIM }}
          TG_TOKEN_EMA: ${{ secrets.TG_TOKEN_EMA }}
          TG_TOKEN_RSI: ${{ secrets.TG_TOKEN_RSI }}
          TEST_RUN: ${{ inputs.test }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BASLA=$(date +%s)
          SURE=19800      # 5 saat 30 dk: bu süreden sonra yeni tarama BAŞLATILMAZ.
                          # Son tarama + durum kaydı + yeni turu başlatma için en az ~28 dk pay kalır
                          # (GitHub sınırı 6 saat, iş zaman aşımı 358 dk).
          while true; do
            python okx_scan_once.py || echo "Tarama hatayla bitti, döngü devam ediyor."
            if [ -f kagit_durum.json ]; then   # kâğıt işlem anlık durumu (okunabilsin diye ayrı dala)
              ( K=$(mktemp -d) && cp kagit_durum.json "$K"/ && cd "$K" && git init -q -b kagit-durum \
                && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add . \
                && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Kâğıt durum" \
                && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" HEAD:kagit-durum ) \
                || echo "Kâğıt durumu gönderilemedi."
            fi
            export TEST_RUN=false          # Test mesajı sadece ilk turda gitsin
            SIMDI=$(date +%s)
            BEKLE=$(( 900 - SIMDI % 900 + 20 ))   # Bir sonraki 15 dk mum kapanışı + 20 sn
            if [ $(( SIMDI + BEKLE - BASLA )) -ge $SURE ]; then
              echo "Süre doluyor, bu tur bitiyor; bir sonraki tur başlatılacak."
              break
            fi
            echo "Sonraki tarama $BEKLE saniye sonra."
            # Taramalar arasında her dakika fiyat alarmlarını kontrol et
            SONRAKI=$(( SIMDI + BEKLE ))
            while [ $(( SONRAKI - $(date +%s) )) -gt 75 ]; do
              sleep 60
              python okx_scan_once.py --alarm || echo "Alarm kontrolü hatayla bitti."
            done
            KALAN=$(( SONRAKI - $(date +%s) ))
            if [ $KALAN -gt 0 ]; then sleep $KALAN; fi
          done

      - name: Durumu kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Bir sonraki turu baslat
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scan.yml --ref ${{ github.ref_name }} -f test=false
