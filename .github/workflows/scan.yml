name: OKX Hacim Tarayici

on:
  schedule:
    - cron: "7 * * * *"          # Yedek: zincir koparsa saatte bir yeniden başlatır
  workflow_dispatch:
    inputs:
      test:
        description: "Test mesajı gönder"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write                 # Bir sonraki turu kendisi başlatabilmesi için

concurrency:
  group: okx-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Onceki durumu geri yukle
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: state-

      - run: pip install requests

      - name: Taramayi 15 dakikada bir calistir (yaklasik 5 saat 40 dk)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TEST_RUN: ${{ inputs.test }}
        run: |
          BASLA=$(date +%s)
          SURE=20400
          while true; do
            python okx_scan_once.py || echo "Tarama hatayla bitti, döngü devam ediyor."
            export TEST_RUN=false          # Test mesajı sadece ilk turda gitsin
            SIMDI=$(date +%s)
            if [ $((SIMDI - BASLA)) -ge $SURE ]; then
              echo "Süre doldu, bu tur bitiyor."
              break
            fi
            BEKLE=$(( 900 - SIMDI % 900 + 20 ))   # Bir sonraki 15 dk mum kapanışı + 20 sn
            echo "Sonraki tarama $BEKLE saniye sonra."
            sleep $BEKLE
          done

      - name: Durumu kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Bir sonraki turu baslat
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scan.yml --ref ${{ github.ref_name }} -f test=false
