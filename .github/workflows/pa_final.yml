name: PA Final Testi

# pa_final.py: kapsamlı 2 yıllık final testi. Mesaj göndermez, canlı bota dokunmaz.
# Sonuç "pa-test-sonuclari" dalına final_sonuc.md olarak eklenir.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: okx-pa-final

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 1H veriyi geri yukle
        uses: actions/cache/restore@v4
        with:
          path: final_cache.json.gz
          key: pa-final-${{ github.run_id }}
          restore-keys: pa-final-
      - name: Gunluk veriyi geri yukle
        uses: actions/cache/restore@v4
        with:
          path: trend_daily.json.gz
          key: pa-daily-${{ github.run_id }}
          restore-keys: pa-daily-
      - run: pip install requests numpy
      - run: python pa_final.py
      - name: 1H veriyi kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: final_cache.json.gz
          key: pa-final-${{ github.run_id }}
      - name: Gunluk veriyi kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: trend_daily.json.gz
          key: pa-daily-${{ github.run_id }}
      - name: Sonucu pa-test-sonuclari dalina ekle
        if: always()
        run: |
          [ -f final_sonuc.md ] || exit 0
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git clone -q --depth 1 -b pa-test-sonuclari "$URL" /tmp/sonuc
          cp final_sonuc.md /tmp/sonuc/
          cd /tmp/sonuc
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add final_sonuc.md
          git commit -q -m "PA final testi (çalışma ${{ github.run_id }})"
          git push -q origin HEAD:pa-test-sonuclari
