name: PA EMA Hizli Islem Testi

# pa_ema.py: EMA ile 15m/30m/1H hızlı işlem (sabit TP) testi, 2 yıl.
# Mesaj göndermez, canlı bota dokunmaz. Sonuç "pa-test-sonuclari" dalına ema_sonuc.md olarak eklenir.

on:
  push:
    branches: [pa-strateji]
    paths: [pa_ema.py]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: okx-pa-ema

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 15m veriyi geri yukle
        uses: actions/cache/restore@v4
        with:
          path: mpa_cache.npz
          key: pa-mpa-${{ github.run_id }}
          restore-keys: pa-mpa-
      - run: pip install requests numpy
      - run: python pa_ema.py
      - name: 15m veriyi kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: mpa_cache.npz
          key: pa-mpa-${{ github.run_id }}
      - name: Sonucu pa-test-sonuclari dalina ekle
        if: always()
        run: |
          [ -f ema_sonuc.md ] || exit 0
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git clone -q --depth 1 -b pa-test-sonuclari "$URL" /tmp/sonuc
          cp ema_sonuc.md /tmp/sonuc/
          cd /tmp/sonuc
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ema_sonuc.md
          git commit -q -m "EMA hızlı işlem testi (çalışma ${{ github.run_id }})"
          git push -q origin HEAD:pa-test-sonuclari
