name: PA Gecmis Test

# Geçmişe dönük test ve ayar araması (pa_backtest.py). Telegram'a MESAJ GÖNDERMEZ
# (secret verilmez), canlı botun durum dosyasına dokunmaz. Sonuçlar çalışmanın özet sayfasında görünür.

on:
  push:
    branches: [pa-strateji]
  workflow_dispatch:
    inputs:
      gun:
        description: "Kaç gün geriye test edilsin (30-150)"
        default: "120"
      dogrulama:
        description: "Bunun son kaç günü doğrulama için ayrılsın"
        default: "40"

concurrency:
  group: okx-pa-test

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Onceki test verisini geri yukle
        uses: actions/cache/restore@v4
        with:
          path: bt_cache.json.gz
          key: pa-bt-${{ github.run_id }}
          restore-keys: pa-bt-
      - run: pip install requests
      - run: python pa_backtest.py
        env:
          PA_BACKTEST: ${{ inputs.gun || '120' }}
          PA_TEST_DAYS: ${{ inputs.dogrulama || '40' }}
      - name: Test verisini kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: bt_cache.json.gz
          key: pa-bt-${{ github.run_id }}
